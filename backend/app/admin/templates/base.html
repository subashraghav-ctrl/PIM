<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PIM Admin{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-gray-100 min-h-screen">

{% if admin is defined %}
<nav class="bg-gray-900 text-white px-6 py-3 flex items-center justify-between shadow">
  <div class="flex items-center gap-6">
    <span class="font-bold text-lg tracking-tight">PIM</span>
    <a href="/admin/" class="text-sm hover:text-blue-300 {% if request.url.path == '/admin/' %}text-blue-400{% endif %}">Dashboard</a>
    <a href="/admin/users" class="text-sm hover:text-blue-300 {% if '/admin/users' in request.url.path %}text-blue-400{% endif %}">Users</a>
    <a href="/admin/roles" class="text-sm hover:text-blue-300 {% if '/admin/roles' in request.url.path %}text-blue-400{% endif %}">Roles</a>
    <a href="/admin/requests" class="text-sm hover:text-blue-300 {% if '/admin/requests' in request.url.path %}text-blue-400{% endif %}">Access Requests</a>
    <a href="/admin/audit" class="text-sm hover:text-blue-300 {% if '/admin/audit' in request.url.path %}text-blue-400{% endif %}">Audit Log</a>
  </div>
  <div class="flex items-center gap-4 text-sm">
    <span class="text-gray-400">{{ admin.username }}</span>
    <a href="/admin/logout" class="text-red-400 hover:text-red-300">Logout</a>
  </div>
</nav>
{% endif %}

<main class="max-w-7xl mx-auto px-6 py-8">
  {% block content %}{% endblock %}
</main>

</body>
</html>
